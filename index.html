<title>ソフトテニスラボ</title>

<style>
:root{--gold:#C9A84C;--gold-light:#E8D5A0;--gold-pale:#FDF8EE;--gold-dark:#8B6914;--off-white:#FAFAF7;--warm-gray:#F5F0E8;--text-primary:#1a1a1a;--text-secondary:#666;--text-muted:#aaa;--border:#E8E0D0;--border-gold:#D4B86A;--white:#ffffff;--s1-bg:#EAF4FB;--s1-c:#1a6fa0;--s1-b:#b0d4ec;--s2-bg:#FDF8EE;--s2-c:#9a7520;--s2-b:#ddc878;--s3-bg:#FEF0F0;--s3-c:#b03030;--s3-b:#e8b0b0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans JP',sans-serif;background:var(--warm-gray);min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;background:var(--off-white);display:flex;flex-direction:column}
.nav-bar{background:var(--off-white);border-bottom:1px solid var(--border-gold);padding:14px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:var(--text-primary);letter-spacing:.08em}
.nav-logo span{color:var(--gold)}
.nav-sub{font-size:10px;color:var(--text-muted);margin-top:1px}
.nav-back{display:none;align-items:center;gap:6px;color:var(--gold-dark);font-size:13px;cursor:pointer;background:none;border:none;font-family:'Noto Sans JP',sans-serif}
.screen-body{flex:1;overflow-y:auto;padding:14px 14px 100px}
.search-wrap{position:relative;margin-bottom:14px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:13px;height:13px;border:1.5px solid var(--gold);border-radius:50%;pointer-events:none}
.search-input{width:100%;border:1px solid var(--border-gold);border-radius:10px;padding:10px 12px 10px 34px;font-size:14px;color:var(--text-primary);background:var(--white);font-family:'Noto Sans JP',sans-serif;outline:none}
.search-input::placeholder{color:var(--text-muted)}
.cat-label{font-size:10px;color:var(--gold-dark);letter-spacing:.1em;margin-bottom:7px;font-weight:500}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--white);color:var(--text-secondary);font-size:12px;padding:5px 12px;border-radius:20px;border:.5px solid var(--border);cursor:pointer;font-family:'Noto Sans JP',sans-serif}
.chip.active{background:var(--gold);color:var(--white);border-color:var(--gold);font-weight:500}
.divider{border:none;border-top:.5px solid var(--border);margin:10px 0}
.result-card{border:.5px solid var(--border);border-radius:12px;padding:13px;margin-bottom:9px;background:var(--white);position:relative;overflow:hidden;cursor:pointer;transition:all .2s}
.result-card:hover{border-color:var(--gold-light);transform:translateY(-1px)}
.result-card.featured{border-color:var(--gold)}
.result-card.featured::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.result-tag{font-size:10px;color:var(--gold-dark);border:.5px solid var(--gold);padding:2px 9px;border-radius:10px;display:inline-block;margin-bottom:6px;background:var(--gold-pale);font-family:'Cormorant Garamond',serif;font-weight:600}
.result-title{font-size:15px;font-weight:500;color:var(--text-primary);margin-bottom:3px}
.result-sub{font-size:12px;color:var(--text-secondary);margin-bottom:7px}
.step-pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;margin-right:4px;margin-top:2px}
.s1{background:var(--s1-bg);color:var(--s1-c);border:.5px solid var(--s1-b)}
.s2{background:var(--s2-bg);color:var(--s2-c);border:.5px solid var(--s2-b)}
.s3{background:var(--s3-bg);color:var(--s3-c);border:.5px solid var(--s3-b)}
.detail-view{display:none}
.kanjo-box{background:var(--gold-pale);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:14px}
.kanjo-label{font-size:13px;font-weight:500;color:var(--gold-dark);margin-bottom:8px;font-family:'Cormorant Garamond',serif}
.kanjo-item{font-size:12px;color:var(--text-secondary);margin-bottom:5px;padding-left:2px;line-height:1.6}
.section-label{font-size:10px;color:var(--gold-dark);letter-spacing:.1em;margin-bottom:9px;font-weight:500}
.step-card{border:.5px solid var(--border);border-radius:12px;padding:13px;margin-bottom:9px;background:var(--white)}
.step-header{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.step-badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap}
.step-name{font-size:13px;font-weight:500;color:var(--text-primary)}
.step-meta{font-size:11px;color:var(--text-muted);margin-bottom:8px}
.step-body{font-size:12px;color:var(--text-secondary);line-height:1.7;margin-bottom:9px}
.video-row{display:flex;flex-wrap:wrap;gap:5px}
.video-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#b03030;background:var(--s3-bg);padding:3px 9px;border-radius:6px;border:.5px solid var(--s3-b);cursor:pointer;text-decoration:none}
.yt-icon{width:13px;height:9px;background:#b03030;border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.yt-tri{width:0;height:0;border-top:3px solid transparent;border-bottom:3px solid transparent;border-left:5px solid white;margin-left:1px}
.no-video{font-size:11px;color:var(--text-muted);font-style:italic}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;justify-content:space-around;padding:10px 0 18px;background:var(--off-white);border-top:1px solid var(--border-gold);z-index:10}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--text-muted);cursor:pointer;padding:0 16px}
.bnav-item.active{color:var(--gold-dark)}
.bnav-dot{width:4px;height:4px;border-radius:50%;background:transparent}
.bnav-item.active .bnav-dot{background:var(--gold)}
.note-screen{display:none;padding:16px}
.note-coming{text-align:center;padding:60px 20px}
.note-coming-title{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold-dark);margin-bottom:10px}
.note-coming-sub{font-size:13px;color:var(--text-muted);line-height:1.7}
.badge-coming{display:inline-block;background:var(--gold-pale);color:var(--gold-dark);border:.5px solid var(--gold-light);font-size:11px;padding:4px 12px;border-radius:20px;margin-bottom:18px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:13px;display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .22s ease forwards}
</style>

<body>
<div class="app">
  <div class="nav-bar" id="navBar">
    <div id="navHome">
      <div class="nav-logo">ソフトテニス<span>ラボ</span></div>
      <div class="nav-sub">苦手を入力して練習を探す</div>
    </div>
    <button class="nav-back" id="navBack" onclick="showHome()">← 戻る</button>
  </div>
  <div class="screen-body" id="homeScreen">
    <div class="search-wrap">
      <div class="search-icon"></div>
      <input class="search-input" type="text" placeholder="苦手なプレーを入力…" id="searchInput" oninput="onSearch()">
    </div>
    <div id="browseArea">
      <div class="cat-label">CATEGORY</div>
      <div class="chip-row" id="catChips">
        <span class="chip active" onclick="selectCat(this,'all')">すべて</span>
        <span class="chip" onclick="selectCat(this,'stroke')">ストローク</span>
        <span class="chip" onclick="selectCat(this,'volley')">ボレー</span>
        <span class="chip" onclick="selectCat(this,'service')">サービス</span>
      </div>
      <div id="subCatArea" style="display:none">
        <div class="cat-label" id="subCatLabel"></div>
        <div class="chip-row" id="subCatChips"></div>
      </div>
      <div class="divider"></div>
    </div>
    <div id="resultList"></div>
    <div class="empty-state" id="emptyState">🎾 該当する練習メニューが見つかりませんでした</div>
  </div>
  <div class="screen-body detail-view" id="detailScreen"></div>
  <div class="screen-body note-screen" id="noteScreen">
    <div class="note-coming">
      <div class="badge-coming">COMING SOON</div>
      <div class="note-coming-title">テニスノート機能</div>
      <div class="note-coming-sub">練習日誌・課題管理機能は<br>近日公開予定です。お楽しみに！</div>
    </div>
  </div>
  <div class="bottom-nav">
    <div class="bnav-item active" id="bnav-search" onclick="switchTab('search')"><div class="bnav-dot"></div><span>練習を探す</span></div>
    <div class="bnav-item" id="bnav-note" onclick="switchTab('note')"><div class="bnav-dot"></div><span>ノート</span></div>
  </div>
</div>

const SUB_CATS={stroke:[{key:'all_s',label:'すべて'},{key:'fore',label:'フォア'},{key:'back',label:'バック'},{key:'course',label:'コース'},{key:'quality',label:'球質'},{key:'special',label:'特殊ショット'}],volley:[{key:'all_v',label:'すべて'},{key:'shot',label:'ショット'},{key:'poach',label:'ポーチ'}],service:[{key:'all_sv',label:'すべて'},{key:'normal',label:'通常サーブ'},{key:'cut',label:'カットサーブ'}]};

let currentCat='all',currentSubCat=null;
renderList(DB);

function renderList(items){
  const list=document.getElementById('resultList'),empty=document.getElementById('emptyState');
  if(!items.length){list.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  list.innerHTML=items.map(d=>`<div class="result-card ${d.featured?'featured':''} fade-in" onclick="showDetail(${d.id})"><div class="result-tag">${d.label}</div><div class="result-title">${d.title}</div><div class="result-sub">${d.desc}</div><div>${d.steps.length?'<span class="step-pill s1">Step1</span><span class="step-pill s2">Step2</span><span class="step-pill s3">Step3</span>':'<span style="font-size:11px;color:var(--text-muted)">準備中</span>'}</div></div>`).join('');
}

function selectCat(el,cat){
  document.querySelectorAll('#catChips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');currentCat=cat;currentSubCat=null;
  const sub=document.getElementById('subCatArea');
  if(cat!=='all'&&SUB_CATS[cat]){
    sub.style.display='block';
    document.getElementById('subCatLabel').textContent=cat==='stroke'?'STROKE':cat==='volley'?'VOLLEY':'SERVICE';
    document.getElementById('subCatChips').innerHTML=SUB_CATS[cat].map((s,i)=>`<span class="chip ${i===0?'active':''}" onclick="selectSubCat(this,'${s.key}')">${s.label}</span>`).join('');
    currentSubCat=SUB_CATS[cat][0].key;
  }else{sub.style.display='none';}
  applyFilter();
}

function selectSubCat(el,sub){document.querySelectorAll('#subCatChips .chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');currentSubCat=sub;applyFilter();}

function applyFilter(){
  let items=DB;
  if(currentCat!=='all') items=items.filter(d=>d.cat===currentCat);
  if(currentSubCat&&!currentSubCat.startsWith('all_')) items=items.filter(d=>d.subCat===currentSubCat);
  const q=document.getElementById('searchInput').value.trim();
  if(q) items=items.filter(d=>d.title.includes(q)||d.desc.includes(q)||d.subCatLabel.includes(q));
  renderList(items);
}

function onSearch(){applyFilter();}

function showDetail(id){
  const d=DB.find(x=>x.id===id);if(!d)return;
  const stepsHTML=d.steps.length?d.steps.map(s=>{
    const vids=YT[s.vk]||[];
    return `<div class="step-card fade-in"><div class="step-header"><span class="step-badge s${s.lv}">${s.label}</span><span class="step-name">${s.name}</span></div><div class="step-meta">👥 ${s.players}</div><div class="step-body">${s.body}</div><div class="video-row">${vids.length?vids.map(v=>`<a class="video-chip" href="${v.url}" target="_blank" rel="noopener"><div class="yt-icon"><div class="yt-tri"></div></div>${v.label}</a>`).join(''):'<span class="no-video">動画は順次追加予定</span>'}</div></div>`;
  }).join(''):'<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:13px">準備中</div>';
  document.getElementById('detailScreen').innerHTML=`<div class="kanjo-box fade-in"><div class="kanjo-label">POINT — 勘所</div>${d.points.map(p=>`<div class="kanjo-item">・${p}</div>`).join('')}</div><div class="section-label">PRACTICE MENU</div>${stepsHTML}`;
  document.getElementById('homeScreen').style.display='none';
  document.getElementById('detailScreen').style.display='block';
  document.getElementById('navHome').style.display='none';
  document.getElementById('navBack').style.display='flex';
  document.getElementById('navBack').textContent=`← ${d.subCatLabel} › ${d.title}`;
  document.getElementById('detailScreen').scrollTop=0;
}

function showHome(){
  document.getElementById('homeScreen').style.display='block';
  document.getElementById('detailScreen').style.display='none';
  document.getElementById('navHome').style.display='block';
  document.getElementById('navBack').style.display='none';
}

function switchTab(tab){
  document.querySelectorAll('.bnav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('bnav-'+tab).classList.add('active');
  document.getElementById('homeScreen').style.display=tab==='search'?'block':'none';
  document.getElementById('detailScreen').style.display='none';
  document.getElementById('noteScreen').style.display=tab==='note'?'block':'none';
  document.getElementById('navHome').style.display='block';
  document.getElementById('navBack').style.display='none';
}
</script>
